<script id="gen">
(function(root){
'use strict';
// ---- generations: 0 plaster ground, 1 underpaint, 2 midtone, 3 sfumato glaze, 4 highlight accents
var GEN_SIZE=[2.6,1.6,1.0,1.8,0.6], GEN_COV=[2.0,1.0,1.4,0.45,0.22], GEN_OPA=[1.0,0.92,0.86,0.30,0.78];
function rngf(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function ih(x,y,z){var h=Math.imul(x|0,-1918454973)^Math.imul(y|0,-669632447)^Math.imul(z|0,-887442657);h=Math.imul(h^(h>>>16),2146121005);h=Math.imul(h^(h>>>15),-2073254261);h^=h>>>16;return(h&0x7fffffff)*4.656612873077393e-10;}
function sm(t){t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function vn(x,y,z){var X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);var fx=sm(x-X),fy=sm(y-Y),fz=sm(z-Z);
 var a=ih(X,Y,Z),b=ih(X+1,Y,Z),c=ih(X,Y+1,Z),d=ih(X+1,Y+1,Z),e=ih(X,Y,Z+1),f=ih(X+1,Y,Z+1),g=ih(X,Y+1,Z+1),h=ih(X+1,Y+1,Z+1);
 var x1=a+(b-a)*fx,x2=c+(d-c)*fx,x3=e+(f-e)*fx,x4=g+(h-g)*fx;var y1=x1+(x2-x1)*fy,y2=x3+(x4-x3)*fy;return y1+(y2-y1)*fz;}
function fbm(x,y,z,o){var s=0,a=0.5,f=1,n=0;o=o||4;for(var i=0;i<o;i++){s+=a*vn(x*f,y*f,z*f);n+=a;a*=0.5;f*=2.03;}return s/n;}
var f32=new Float32Array(1),u32=new Uint32Array(f32.buffer);
function toHalf(v){f32[0]=v;var x=u32[0];var s=(x>>>16)&0x8000;var e=((x>>>23)&0xff)-112;var m=x&0x7fffff;if(e<=0)return s;if(e>=31)return s|0x7bff;return s|(e<<10)|(m>>>13);}
function oct(nx,ny,nz){var l=Math.abs(nx)+Math.abs(ny)+Math.abs(nz)||1;var x=nx/l,y=ny/l;if(nz<0){var ox=(1-Math.abs(y))*(x>=0?1:-1),oy=(1-Math.abs(x))*(y>=0?1:-1);x=ox;y=oy;}
 return((Math.round(x*32767)&0xffff)|((Math.round(y*32767)&0xffff)<<16))>>>0;}
function c8(v){v=v<0?0:v>1?1:v;return(v*255+0.5)|0;}
function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function mulc(a,k){return[a[0]*k,a[1]*k,a[2]*k];}
function clamp01(v){return v<0?0:v>1?1:v;}

function SB(cap){this.cap=cap;this.n=0;this.ab=new ArrayBuffer(cap*36);this.f=new Float32Array(this.ab);this.u=new Uint32Array(this.ab);this.k=new Int32Array(cap);}
SB.prototype.grow=function(){var c=Math.ceil(this.cap*1.6)+1024;var ab=new ArrayBuffer(c*36);new Uint8Array(ab).set(new Uint8Array(this.ab));var k=new Int32Array(c);k.set(this.k);this.ab=ab;this.f=new Float32Array(ab);this.u=new Uint32Array(ab);this.k=k;this.cap=c;};
SB.prototype.push=function(p,n,t,w,l,L,S,gen,kind,opa,bone,seed,ao,key){
 if(this.n>=this.cap)this.grow();
 var nx=n[0],ny=n[1],nz=n[2],tx=t[0],ty=t[1],tz=t[2];
 var d=tx*nx+ty*ny+tz*nz;tx-=nx*d;ty-=ny*d;tz-=nz*d;var tl=Math.sqrt(tx*tx+ty*ty+tz*tz);
 if(tl<1e-5){if(Math.abs(ny)<0.9){tx=-nz;ty=0;tz=nx;}else{tx=1;ty=0;tz=0;}d=tx*nx+ty*ny+tz*nz;tx-=nx*d;ty-=ny*d;tz-=nz*d;tl=Math.sqrt(tx*tx+ty*ty+tz*tz)||1;}
 tx/=tl;ty/=tl;tz/=tl;
 var i=this.n*9,f=this.f,u=this.u;
 f[i]=p[0];f[i+1]=p[1];f[i+2]=p[2];u[i+3]=oct(nx,ny,nz);u[i+4]=oct(tx,ty,tz);
 u[i+5]=(toHalf(w)|(toHalf(l)<<16))>>>0;
 u[i+6]=(c8(L[0])|(c8(L[1])<<8)|(c8(L[2])<<16)|(((gen|(kind<<3))&255)<<24))>>>0;
 u[i+7]=(c8(S[0])|(c8(S[1])<<8)|(c8(S[2])<<16)|(c8(opa)<<24))>>>0;
 u[i+8]=((bone&0xffff)|((seed&255)<<16)|(c8(ao)<<24))>>>0;
 this.k[this.n]=key;this.n++;};

// ---------- paints: each surface gets a light paint and a shade paint ----------
function paints(c,outL,outS){
 var lum=0.3*c[0]+0.59*c[1]+0.11*c[2];
 outL[0]=clamp01(c[0]*1.08+0.06);outL[1]=clamp01(c[1]*1.03+0.045);outL[2]=clamp01(c[2]*0.9+0.015);
 // cool smoky brown-grey shade, deep but never black
 outS[0]=Math.max(0.035,c[0]*0.30*0.62+lum*0.30*0.38);outS[1]=Math.max(0.033,c[1]*0.30*0.62+lum*0.29*0.38);outS[2]=Math.max(0.036,c[2]*0.31*0.62+lum*0.34*0.38);
}

// ---------- room AO ----------
function roomAO(p){
 var x=p[0],y=p[1],z=p[2];
 if(z<-9.2||z>8.2||Math.abs(x)>5.2)return 1;
 var dW=Math.min(5-Math.abs(x),z+9,8-z);
 var ao=(0.72+0.28*sm(dW/1.4))*(0.74+0.26*sm(y/0.9))*(0.82+0.18*sm((4.6-y)/0.9));
 if(Math.abs(x)<4.4&&z>-1.75&&z<-0.7&&y<0.93)ao*=0.42;
 if(Math.abs(x)<4.3&&z<-1.6&&z>-2.6&&y<0.6)ao*=0.55;
 return ao;
}

// ---------- materials ----------
var TMP=[0,0,0];
function tapestry(s,P){
 var u=s.loc[0],v=s.loc[1],la=P.la,lb=P.lb;
 var bd=Math.min(u,la-u,v,lb-v);
 var c=[0.20,0.235,0.145];
 if(bd<0.09)return mixc([0.32,0.29,0.17],[0.25,0.24,0.15],sm(bd/0.09));
 if(bd<0.13)return[0.16,0.17,0.11];
 var cu=0.34,cv=0.4;var iu=Math.floor(u/cu),iv=Math.floor(v/cv);var fu=u/cu-iu-0.5,fv=v/cv-iv-0.5;
 if((iu+iv)&1){fu=u/cu-iu;fv=v/cv-iv;fu=fu<0.5?fu:fu-1;fv=fv<0.5?fv:fv-1;}
 var r=Math.sqrt(fu*fu+fv*fv),th=Math.atan2(fv,fu);
 var petal=0.2*(0.65+0.35*Math.cos(5*th));
 if(r<petal)c=mixc(c,[0.34,0.33,0.19],0.75*(1-r/petal*0.6));
 else if(r<petal+0.05&&Math.abs(Math.sin(th*3))<0.25)c=mixc(c,[0.27,0.3,0.24],0.6);
 if(r<0.045)c=[0.40,0.33,0.18];
 return mulc(c,0.9+0.2*fbm(u*3,v*3,P.seedv||0,2));
}
function face(P,s,res){
 var d=s.loc,c=P.c.slice(),ao=1;
 for(var k=-1;k<=1;k+=2){var ex=d[0]-k*0.37,ey=(d[1]-0.12)*1.3,ez=d[2]-0.9;var r2=ex*ex+ey*ey+ez*ez;
  var sock=Math.exp(-r2/0.05);ao*=1-0.5*sock;c=mixc(c,[c[0]*0.6,c[1]*0.52,c[2]*0.55],sock*0.7);
  if(r2<0.0065)c=mixc(c,[0.1,0.07,0.06],0.95);else if(r2<0.014)c=mixc(c,[0.78,0.72,0.64],0.3);}
 var bro=Math.exp(-((d[1]-0.32)*(d[1]-0.32))/0.004)*Math.max(0,d[2]-0.55);c=mixc(c,P.hc||[0.3,0.2,0.12],clamp01(bro*1.4)*0.6);
 for(k=-1;k<=1;k+=2){var ch=Math.exp(-((d[0]-k*0.45)*(d[0]-k*0.45)+(d[1]+0.12)*(d[1]+0.12))/0.04)*Math.max(0,d[2]);c=mixc(c,[c[0]*1.05,c[1]*0.86,c[2]*0.82],ch*0.5);}
 var my=d[1]+0.43,mo=Math.exp(-(my*my)/0.002-(d[0]*d[0])/0.035)*Math.max(0,d[2]-0.6)*3;c=mixc(c,[0.42,0.2,0.17],clamp01(mo)*0.75);ao*=1-0.3*clamp01(mo);
 var un=Math.exp(-((d[1]+0.22)*(d[1]+0.22))/0.004-(d[0]*d[0])/0.02)*Math.max(0,d[2]-0.7);ao*=1-0.35*clamp01(un*3);
 ao*=0.72+0.28*Math.max(0,d[2]);
 if(P.dark)ao*=0.7;
 res.ao=ao;return c;
}
var FIELDS=[[0.46,0.50,0.35],[0.55,0.54,0.37],[0.41,0.47,0.33],[0.60,0.55,0.38],[0.50,0.53,0.40],[0.44,0.45,0.31]];
function groundY(x,z){var r=Math.sqrt(x*x+z*z);var y=-0.6;if(r>15)y-=6.2*sm((r-15)/34);if(r>45)y+=5*(fbm(x*0.006,0,z*0.006,3)-0.5);return y;}
function riverT(r){return 0.32*Math.sin(r*0.011+0.4)+0.12*Math.sin(r*0.029)-0.12;}
function MAT(P,s,R,g,res){
 var p=s.p,ao=1,c;
 switch(P.m){
 case 'wall':{c=mulc(P.c||[0.60,0.54,0.42],0.84+0.3*fbm(p[0]*0.45,p[1]*0.45,p[2]*0.45,3));
   if(P.dado&&p[1]<0.5)c=mulc(c,0.8);ao=roomAO(p);break;}
 case 'tap':c=tapestry(s,P);ao=roomAO(p)*0.95;break;
 case 'floor':{var fx=p[0]/0.62,fz=p[2]/0.62;var ix=Math.floor(fx),iz=Math.floor(fz);var lx=Math.min(fx-ix,1-fx+ix),lz=Math.min(fz-iz,1-fz+iz);
   c=((ix+iz)&1)?[0.43,0.36,0.27]:[0.36,0.30,0.235];c=mulc(c,0.88+0.24*fbm(p[0]*1.3,0,p[2]*1.3,3));
   if(lx<0.035||lz<0.035){c=mulc(c,0.6);s.t[0]=lx<lz?0:1;s.t[1]=0;s.t[2]=lx<lz?1:0;}
   ao=roomAO(p);break;}
 case 'ceil':{var u=s.loc[0]/1.0,v=s.loc[1]/1.06;var cu=u-Math.floor(u),cv=v-Math.floor(v);var bw=0.13;
   if(cu<bw||cv<bw){c=[0.62,0.50,0.34];if(cu<bw){s.t[0]=0;s.t[1]=0;s.t[2]=1;}else{s.t[0]=1;s.t[1]=0;s.t[2]=0;}
     var e=Math.min(cu<bw?Math.abs(cu-bw*0.5):1,cv<bw?Math.abs(cv-bw*0.5):1);ao=0.8+0.2*(1-e/(bw*0.5));}
   else{var e2=Math.min(cu-bw,1-cu,cv-bw,1-cv);c=mixc([0.36,0.27,0.19],[0.22,0.2,0.2],sm(e2/0.14));ao=0.55+0.25*sm(e2/0.2);
     var du=cu-0.565,dv=cv-0.565;if(du*du+dv*dv<0.006)c=[0.52,0.40,0.22];
     if(Math.abs(du)>Math.abs(dv)){s.t[0]=0;s.t[1]=0;s.t[2]=1;}else{s.t[0]=1;s.t[1]=0;s.t[2]=0;}}
   c=mulc(c,0.9+0.2*fbm(p[0]*2,0,p[2]*2,2));ao*=roomAO(p);break;}
 case 'cloth':{var base=[0.87,0.86,0.82],fold=[0.60,0.65,0.72];var x=p[0];c=base;
   if(P.part==='top'){var q=(x+4.35)/0.58;q=q-Math.floor(q);var cr=Math.exp(-((q-0.5)*(q-0.5))/0.0012);var hl=Math.exp(-((q-0.56)*(q-0.56))/0.002);
     var tz=Math.exp(-((s.loc[1]-0.45)*(s.loc[1]-0.45))/0.0008);c=mixc(c,fold,clamp01(cr+tz)*0.55);ao=(1-0.25*clamp01(cr+tz))*(1+0.06*hl);}
   else{var f=0.5+0.5*Math.sin(s.loc[0]*12+2.5*vn(p[0]*2,p[1]*2,p[2]*2));ao=0.68+0.32*f;c=mixc(base,fold,(1-f)*0.5);
     var la=P.la,uu=s.loc[0];if(P.part==='front'&&(uu<1.0||uu>la-1.0)||P.part==='side'){var vv=s.loc[1];var band=Math.floor(vv/0.055);
       var inb=(vv>0.08&&vv<0.36);if(inb&&(band&1)===0){c=[0.30,0.40,0.58];if(Math.sin(uu*60)>0.6)c=[0.55,0.62,0.74];}}
     ao*=roomAO(p)<0.6?0.8:1;s.t[0]=0;s.t[1]=1;s.t[2]=0;}
   break;}
 case 'fab':{var fo=s.fold;c=mulc(P.c,0.82+0.28*fo+0.08*(vn(p[0]*9,p[1]*9,p[2]*9)-0.5));ao=0.55+0.45*fo;if(P.dark)ao*=0.75;break;}
 case 'skin':c=mulc(P.c,0.94+0.12*vn(p[0]*25,p[1]*25,p[2]*25));if(P.dark)ao=0.75;break;
 case 'face':c=face(P,s,res);ao=res.ao;break;
 case 'hair':c=mulc(P.c,0.8+0.4*vn(p[0]*30,p[1]*30,p[2]*30));ao=0.85;break;
 case 'flat':c=mulc(P.c,0.92+0.16*vn(p[0]*12,p[1]*12,p[2]*12));if(P.ao0!=null)ao=P.ao0;break;
 case 'wood':c=mulc(P.c||[0.40,0.28,0.18],0.8+0.3*vn(p[0]*3,p[1]*40,p[2]*3));ao=roomAO(p);break;
 case 'plate':{var rr=s.loc[0]/P.R;c=rr>0.8?[0.48,0.49,0.5]:(rr>0.7?[0.62,0.63,0.64]:[0.56,0.57,0.58]);ao=rr>0.7&&rr<0.8?0.75:1;break;}
 case 'stone':{c=mulc(P.c||[0.62,0.58,0.49],0.84+0.3*fbm(p[0]*0.8,p[1]*0.8,p[2]*0.8,3));if(P.flags){var gx=p[0]/0.9,gz=p[2]/0.9;if(Math.min(gx-Math.floor(gx),gz-Math.floor(gz))<0.04)c=mulc(c,0.7);}break;}
 case 'roof':{var rz=p[2]/0.28;c=mulc([0.56,0.34,0.23],0.8+0.25*vn(p[0]*2,0,Math.floor(rz)));if(rz-Math.floor(rz)<0.15)c=mulc(c,0.7);break;}
 case 'meadow':{c=mulc([0.44,0.49,0.33],0.85+0.3*fbm(p[0]*0.2,0,p[2]*0.2,3));break;}
 case 'ground':{var th=s.loc[0],r=s.loc[1];var rv=Math.abs(th-riverT(r))*r;
   var fi=ih(Math.floor(th*r/45+fbm(p[0]*0.004,0,p[2]*0.004,2)*3),Math.floor(r/38),7);c=FIELDS[(fi*FIELDS.length)|0].slice();
   var fa=fi*Math.PI;s.t[0]=Math.cos(fa);s.t[1]=0;s.t[2]=Math.sin(fa);
   c=mulc(c,0.86+0.26*fbm(p[0]*0.03,0,p[2]*0.03,3));
   if(rv<4+r*0.012){c=[0.55,0.62,0.66];s.t[0]=Math.cos(th);s.t[1]=0;s.t[2]=Math.sin(th);}
   else if(rv<7+r*0.02)c=mixc(c,[0.36,0.42,0.30],0.6);
   break;}
 case 'hill':{var li=P.layer;c=mixc([0.30,0.38,0.33],[0.50,0.58,0.70],li/4);c=mulc(c,0.9+0.18*fbm(p[0]*0.01,p[1]*0.03,p[2]*0.01,3));
   if(li<2&&vn(p[0]*0.05,p[1]*0.1,p[2]*0.05)>0.66)c=mulc(c,0.82);break;}
 case 'tree':c=mulc(P.c||[0.26,0.33,0.21],0.75+0.4*vn(p[0]*0.5,p[1]*0.5,p[2]*0.5));ao=0.55+0.45*clamp01(s.loc[1]*0.5+0.5);break;

 const f=1/Math.tan(CAM.fovY/2),n=0.05,fa=6000;const P=new Float32Array(16);P[0]=f/aspect;P[5]=f;P[10]=(fa+n)/(n-fa);P[11]=-1;P[14]=2*fa*n/(n-fa);

 return M4.mul(P,V);
}
function planes(m){const r=i=>[m[i],m[4+i],m[8+i],m[12+i]];const r0=r(0),r1=r(1),r2=r(2),r3=r(3);const pl=[];
 for(const[s,a]of[[1,r0],[-1,r0],[1,r1],[-1,r1],[1,r2]])pl.push([r3[0]+s*a[0],r3[1]+s*a[1],r3[2]+s*a[2],r3[3]+s*a[3]]);return pl;}
function aabbVisible(pl,mn,mx,c){for(const p of pl){const x=p[0]>0?mx[0]-c[0]:mn[0]-c[0],y=p[1]>0?mx[1]-c[1]:mn[1]-c[1],z=p[2]>0?mx[2]-c[2]:mn[2]-c[2];if(p[0]*x+p[1]*y+p[2]*z+p[3]<0)return false;}return true;}

// ---------------- frame ----------------
const KEYDIR=v3.norm([-0.62,0.62,0.5]);
let drawnStrokes=0,drawCalls=0;
function sizeCanvas(){const T=TIERS[TIER];const dpr=Math.min(window.devicePixelRatio||1,T.dpr);const w=Math.max(2,Math.round(canvas.clientWidth*dpr)),h=Math.max(2,Math.round(canvas.clientHeight*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 const rw=Math.max(2,Math.round(w*ST.scale)),rh=Math.max(2,Math.round(h*ST.scale));if(!RT||RT.w!==rw||RT.h!==rh){makeTargets(rw,rh);ST.still=0;RT.n=0;}return dpr;}
function renderFrame(jitter){
 const dpr=sizeCanvas();const W=RT.w,H=RT.h,aspect=W/H;const T=TIERS[TIER];
 const VP=viewProj(aspect,jitter?jitter[0]:0,jitter?jitter[1]:0,W,H);const pl=planes(VP);const cam=CAM.pos;
 gl.bindFramebuffer(gl.FRAMEBUFFER,RT.ms);gl.viewport(0,0,W,H);gl.clearColor(0.02,0.017,0.014,1);gl.clearDepth(1);gl.depthMask(true);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);
 if(SAMPLES>0)gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
 const focal=0.5*H/Math.tan(CAM.fovY/2);const sc=ST.scale;
 const setU=(P)=>{const u=P.u;gl.useProgram(P.p);gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniform3fv(u.uCam,cam);gl.uniform1f(u.uFocal,focal);gl.uniform1f(u.uMinPx,T.minPx*Math.max(1,dpr*sc*0.75));gl.uniform1f(u.uMaxPx,T.maxPx*dpr*sc);
  gl.uniform1f(u.uTime,ST.simT);gl.uniform1f(u.uRingAmp,ST.annT<6?Math.max(0,1-ST.annT/5):0);gl.uniform1f(u.uFlare,ST.flare);gl.uniform1f(u.uGenDepth,0.0016);
  gl.uniform4f(u.uRing,0,0,-2.05,ST.annT*3.4);gl.uniform3fv(u.uKey,KEYDIR);gl.uniform1f(u.uBristles,T.br);gl.uniform1i(u.uAged,ST.aged?1:0);gl.uniform1i(u.uHashed,SAMPLES>0?0:1);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,boneTex);gl.uniform1i(u.uBones,0);};
 gl.bindTexture(gl.TEXTURE_2D,boneTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NBONES*3,1,gl.RGBA,gl.FLOAT,boneData);
 setU(PS);gl.bindVertexArray(vao);
 const vis=[];for(const c of CHUNKS){if(c.cull===2||aabbVisible(pl,c.min,c.max,cam)){const dx=Math.max(c.min[0]-cam[0],0,cam[0]-c.max[0]),dy=Math.max(c.min[1]-cam[1],0,cam[1]-c.max[1]),dz=Math.max(c.min[2]-cam[2],0,cam[2]-c.max[2]);c.d=dx*dx+dy*dy+dz*dz;vis.push(c);}}
 vis.sort((a,b)=>a.d-b.d);drawnStrokes=0;drawCalls=0;
 for(const c of vis){setAttr(c.start*36);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,c.count);drawnStrokes+=c.count;drawCalls++;}
 setU(PG);gl.bindVertexArray(vaoEmpty);const G=T.grid,cell=0.11;const go=[cam[0]-G*cell/2,cam[2]-G*cell/2];
 gl.uniform2f(PG.u.uGO,go[0],go[1]);gl.uniform1f(PG.u.uCell,cell);gl.uniform1i(PG.u.uGrid,G);gl.uniform1f(PG.u.uGR,G*cell/2);gl.uniform2f(PG.u.uWind,0.25,0.9);
 gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,G*G*2);drawnStrokes+=G*G*2;drawCalls++;
 gl.bindVertexArray(null);gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.disable(gl.DEPTH_TEST);
 gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.ms);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.rf);gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
 const accumulate=!!jitter&&RT.n>0;const dst=RT.acc[RT.cur^1],src=RT.acc[RT.cur];
 gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,W,H);gl.useProgram(PA.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(PA.u.uPrev,0);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.rt);gl.uniform1i(PA.u.uCur,1);gl.uniform1f(PA.u.uW,accumulate?1/(RT.n+1):1);gl.drawArrays(gl.TRIANGLES,0,3);
 RT.cur^=1;RT.n=accumulate?RT.n+1:1;
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(PT.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dst.t);gl.uniform1i(PT.u.uTex,0);
 gl.uniform1f(PT.u.uExp,2.05);gl.uniform2f(PT.u.uRes,canvas.width,canvas.height);gl.drawArrays(gl.TRIANGLES,0,3);
 if(firstImageMs<0&&genDone>0){firstImageMs=performance.now()-genStart;window.__firstImageMs=firstImageMs;}
}
function present(){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(PT.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.acc[RT.cur].t);gl.uniform1i(PT.u.uTex,0);gl.uniform1f(PT.u.uExp,2.05);gl.drawArrays(gl.TRIANGLES,0,3);}
const HALTON=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;};

// ---------------- UI ----------------
let flashT=0;function flash(s){const e=$('flash');e.textContent=s;e.style.opacity=1;flashT=2.5;}
function setTier(t){if(!TIERS[t]||t===TIER)return;TIER=t;$('tier').value=t;RT&&makeTargets(RT.w,RT.h);generate();}
$('tier').addEventListener('change',e=>setTier(e.target.value));
const toggles={bTour:()=>{ST.tour=!ST.tour;ST.tourT=0;},bCam:()=>{ST.cam=ST.cam==='paint'?'follow':'paint';CAM.fpos=null;},bAged:()=>{ST.aged=!ST.aged;ST.still=0;},
 bPhoto:()=>{ST.photo=!ST.photo;document.body.classList.toggle('photo',ST.photo);ST.still=0;if(ST.photo)flash('Photo mode — hold still for a clean accumulated image (P to exit)');},
 bHud:()=>{ST.hud=!ST.hud;},bSnd:()=>toggleSound()};
for(const k in toggles)$(k).addEventListener('click',e=>{toggles[k]();e.currentTarget.blur();syncUI();});
function syncUI(){$('bTour').classList.toggle('on',ST.tour);$('bCam').textContent=ST.cam==='paint'?'View: painting (C)':'View: follow (C)';$('bAged').classList.toggle('on',ST.aged);$('bPhoto').classList.toggle('on',ST.photo);$('bHud').classList.toggle('on',ST.hud);$('bSnd').textContent=ST.sound?'Sound on (M)':'Sound off (M)';$('hud').style.display=ST.hud?'block':'none';}
const KMAP={w:'KeyW',a:'KeyA',s:'KeyS',d:'KeyD',W:'KeyW',A:'KeyA',S:'KeyS',D:'KeyD'};
const MOVE=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
function takeControl(){if(ST.tour){ST.tour=false;}CAM.preset=null;if(ST.cam!=='follow'){ST.cam='follow';CAM.fy=SERV.yaw+Math.PI;CAM.fp=0.35;CAM.fd=3.4;CAM.fpos=null;flash('You control the servant · C returns to the painting view');}syncUI();}
window.__takeControl=takeControl;
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const c=(e.code&&e.code!=='Unidentified')?e.code:(KMAP[e.key]||e.key);KEY[c]=true;$('kbd').style.display='none';
 if(MOVE.has(c)){e.preventDefault();if(!e.repeat)takeControl();}
 if(c==='Space'){hop();e.preventDefault();}else if(c==='KeyF')serve();else if(c==='KeyE')announce();else if(c==='KeyT')toggles.bTour();else if(c==='KeyP')toggles.bPhoto();else if(c==='KeyG')toggles.bAged();else if(c==='KeyH')toggles.bHud();else if(c==='KeyC')toggles.bCam();else if(c==='KeyM')toggleSound();
 if(/Arrow/.test(c))e.preventDefault();syncUI();});
document.addEventListener('keyup',e=>{const c=(e.code&&e.code!=='Unidentified')?e.code:(KMAP[e.key]||e.key);KEY[c]=false;});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false;});
canvas.tabIndex=0;canvas.style.outline='none';
function kbdHint(){if(!isTouch)$('kbd').style.display=document.hasFocus()?'none':'block';}
addEventListener('focus',kbdHint);addEventListener('blur',kbdHint);setTimeout(()=>{try{window.focus();canvas.focus({preventScroll:true});}catch(_){}kbdHint();},300);
// pointer: drag to look, pinch to zoom
const PTR=new Map();let pinch0=0;
canvas.addEventListener('pointerdown',e=>{try{canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);}catch(_){}PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});if(PTR.size===2){const[a,b]=[...PTR.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
canvas.addEventListener('pointermove',e=>{const p=PTR.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(PTR.size===2){const[a,b]=[...PTR.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0){zoom(pinch0/d);}pinch0=d;return;}
 ST.still=0;if(ST.cam==='paint'&&!ST.tour){CAM.yaw-=dx*0.0035*CAM.fovMul;CAM.pitch=Math.max(-1.0,Math.min(1.0,CAM.pitch-dy*0.0035*CAM.fovMul));}else{CAM.fy-=dx*0.006;CAM.fp=Math.max(-0.2,Math.min(1.2,CAM.fp+dy*0.004));}});
const endP=e=>{PTR.delete(e.pointerId);pinch0=0;};canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
function zoom(k){ST.still=0;if(ST.cam==='paint')CAM.fovMul=Math.max(0.18,Math.min(1.6,CAM.fovMul*k));else CAM.fd=Math.max(1.2,Math.min(9,CAM.fd*k));}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*0.0012));},{passive:false});
// touch UI
const JOY={active:false,x:0,y:0,id:null};
const isTouch=QS.has('touch')||matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
{const joy=$('joy'),knob=$('knob');const upd=e=>{const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}JOY.x=x;JOY.y=y;knob.style.transform=`translate(${x*40}px,${y*40}px)`;};
 joy.addEventListener('pointerdown',e=>{takeControl();try{joy.setPointerCapture(e.pointerId);}catch(_){}JOY.active=true;JOY.id=e.pointerId;upd(e);e.preventDefault();});
 joy.addEventListener('pointermove',e=>{if(JOY.active&&e.pointerId===JOY.id)upd(e);});
 const end=()=>{JOY.active=false;JOY.x=JOY.y=0;knob.style.transform='';};joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
 const tb=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f();});tb('tJump',hop);tb('tServe',serve);tb('tAnn',announce);}

// ---------------- sound (muted by default) ----------------
let AC=null,master=null;
function toggleSound(){ST.sound=!ST.sound;try{if(ST.sound&&!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(master);
  for(const[f,g]of[[110,0.05],[164.8,0.035],[220,0.03],[277.2,0.018]]){const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;const gg=AC.createGain();gg.gain.value=g;const l=AC.createOscillator();l.frequency.value=0.07+f*0.0003;const lg=AC.createGain();lg.gain.value=g*0.5;l.connect(lg);lg.connect(gg.gain);l.start();o.connect(gg);gg.connect(lp);o.start();}}
 if(AC){AC.resume();master.gain.setTargetAtTime(ST.sound?0.6:0,AC.currentTime,0.4);}}catch(e){console.warn('audio',e);}syncUI();}
function sfx(k){if(!AC||!ST.sound)return;const t=AC.currentTime;const g=AC.createGain();g.connect(master);
 const parts=k==='bell'?[[392,1],[588,0.5],[784,0.35],[1046,0.2]]:k==='serve'?[[660,0.3],[990,0.15]]:[[220,0.15]];const dur=k==='bell'?4:0.5;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 for(const[f,a]of parts){const o=AC.createOscillator();o.type='sine';o.frequency.value=f;const og=AC.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur);}}

// ---------------- loop ----------------
let last=performance.now(),fpsAcc=0,fpsN=0,fps=0,lowT=0,highT=0;const FT=[];
function simulate(dt){
 if(!ST.photo){ST.simT+=dt;updateServant(dt);updateAnnouncement(dt);}
 ST.flare=ST.annT<6?Math.exp(-ST.annT*1.1)*Math.min(1,ST.annT*6):0;
 const trayInfo=servantBones();if(!ST.photo)physStep(dt,trayInfo.tc,trayInfo.q);
 animFigures(ST.simT);propBones();
 if(ST.tour&&!ST.photo)ST.tourT+=dt;
}
function loop(now){
 requestAnimationFrame(loop);
 if(window.__shotMode)return;
 let dt=Math.min(0.1,(now-last)/1000);last=now;ST.t+=dt;
 simulate(dt);
 const moving=PTR.size>0||ST.tour||Object.values(KEY).some(Boolean)||JOY.active;
 if(moving||!ST.photo)ST.still=0;else ST.still+=dt;
 const aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight);computeCamera(dt,aspect);
 let jitter=null;if(ST.photo&&ST.still>0.5&&RT&&RT.n<32){jitter=[HALTON(RT.n+1,2)-0.5,HALTON(RT.n+1,3)-0.5];}
 if(ST.photo&&ST.still>0.5&&RT&&RT.n>=32)present();else renderFrame(jitter);
 // frame rate & dynamic resolution (hysteresis)
 fpsAcc+=dt;fpsN++;if(fpsAcc>0.5){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
  if(!ST.photo&&genDone>=genTotal){if(fps<45){lowT+=0.5;highT=0;if(lowT>=1.5&&ST.scale>0.6){ST.scale=Math.max(0.6,ST.scale-0.1);lowT=0;}}else if(fps>57){highT+=0.5;lowT=0;if(highT>=3&&ST.scale<1){ST.scale=Math.min(1,ST.scale+0.05);highT=0;}}else{lowT=highT=0;}}}
 if(flashT>0){flashT-=dt;if(flashT<=0)$('flash').style.opacity=0;}
 if(ST.hud){$('hud').innerHTML=`FPS ${fps.toFixed(0)} · scale ${ST.scale.toFixed(2)}<br>Strokes drawn ${(drawnStrokes/1e6).toFixed(2)} M / loaded ${(genDone/1e6).toFixed(2)} M<br>Draw calls ${drawCalls} · ${SAMPLES}x MSAA ${SAMPLES?'+ A2C':'(hashed alpha)'} · ${HDR?'RGBA16F':'RGBA8'}<br>Tier ${TIER} (${BENCH.why}) · ${WORKER_MODE}<br>Physics: ${PHYS.mode==='rapier'?'Rapier':PHYS.mode==='fallback'?'built-in fallback':'loading…'}${ST.photo?'<br>Photo: '+(RT?RT.n:0)+'/32':''}`;}
}
syncUI();
initPhysics();
generate();
requestAnimationFrame(loop);
setTimeout(()=>{$('help').style.opacity=0;},9000);

// ---------------- verification hooks ----------------
window.__shot=async function(id,opt){opt=opt||{};window.__shotMode=true;await genPromise;
 ST.aged=!!opt.aged;ST.simT=opt.t!=null?opt.t:12;ST.annT=99;ST.flare=0;
 if(id==='protagonist'){SERV.x=-1.0;SERV.z=0.25;SERV.yaw=2.6;SERV.speed=0;SERV.serveT=-1;}
 CAM.preset=PRESETS[id]?id:'canonical';CAM.presetYaw=opt.yawDeg?opt.yawDeg*Math.PI/180:0;
 animFigures(ST.simT);propBones();servantBones();
 const aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight);computeCamera(0,aspect);
 const frames=opt.frames||1;RT&&(RT.n=0);renderFrame(null);for(let i=1;i<frames;i++)renderFrame([HALTON(i,2)-0.5,HALTON(i,3)-0.5]);
 const w=canvas.width,h=canvas.height;const px=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
 let sum=0,sum2=0,dark=0,hist=new Array(8).fill(0);const n=w*h;for(let i=0;i<n;i++){const l=(px[i*4]*0.3+px[i*4+1]*0.59+px[i*4+2]*0.11);sum+=l;sum2+=l*l;if(l<8)dark++;hist[Math.min(7,l>>5)]++;}
 const mean=sum/n;return{w,h,mean,std:Math.sqrt(Math.max(0,sum2/n-mean*mean)),darkFrac:dark/n,hist,drawn:drawnStrokes,loaded:genDone,calls:drawCalls,tier:TIER,phys:PHYS.mode,gl:gl.getError()};
};
window.__info=()=>({tier:TIER,bench:BENCH,renderer:RINFO,hdr:HDR,samples:SAMPLES,genTotal,genDone,genMs:window.__genMs,firstImageMs:window.__firstImageMs,phys:PHYS.mode,logs:LOGS,worker:WORKER_MODE,nb:NBONES,chunks:CHUNKS.length});
window.__serv=SERV;window.__props=()=>PROPS.map(p=>({t:p.type,pos:p.pos.slice(),q:p.q.slice()}));window.__cam=CAM;window.__announce=announce;window.__serve=serve;
window.__release=()=>{window.__shotMode=false;CAM.preset=null;};
})();
