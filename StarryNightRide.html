<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StarryNightRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: a night painting you can ride through; quiet, golden-on-ultramarine
   IDEA: a framed impasto canvas, the UI is small brass gallery labels
   PICTURE: the whole screen is the live painting
   COLOUR and TYPE: ultramarine #0b1d4f, cobalt, moon gold #f2b632; Cormorant Garamond
   LAYOUT: full-bleed canvas, label top-left, controls top-right, touch pads bottom */
:root{color-scheme:dark;--ink:#f3e3b0;--gold:#f2b632;--deep:#0b1d4f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#06102c;color:var(--ink);font:15px/1.4 "Cormorant Garamond",Georgia,serif}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.label{position:fixed;top:12px;left:12px;padding:10px 14px;background:rgba(8,18,52,.62);border:1px solid rgba(242,182,50,.45);border-radius:6px;max-width:min(420px,calc(100vw - 24px));backdrop-filter:blur(3px)}
.label h1{margin:0;font-size:26px;line-height:1.05;color:var(--gold);font-weight:600;letter-spacing:.5px}
.label p{margin:4px 0 0;font-size:14px;opacity:.9}
.label .keys{font-style:italic}
#stats{position:fixed;left:12px;bottom:10px;font:12px/1.3 ui-monospace,Menlo,monospace;color:#cfd9ff;opacity:.75;pointer-events:none;white-space:pre}
.btns{position:fixed;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btns button{font:600 15px "Cormorant Garamond",Georgia,serif;color:var(--ink);background:rgba(8,18,52,.7);border:1px solid rgba(242,182,50,.5);border-radius:6px;padding:8px 12px;min-height:40px;cursor:pointer}
.btns button[aria-pressed=true]{background:rgba(242,182,50,.85);color:#10204d}
.btns button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#joy{position:fixed;left:22px;bottom:26px;width:132px;height:132px;border-radius:50%;background:rgba(10,24,70,.35);border:2px solid rgba(242,182,50,.55);display:none;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(242,182,50,.75);box-shadow:0 0 18px rgba(242,182,50,.5)}
#jump{position:fixed;right:26px;bottom:34px;width:88px;height:88px;border-radius:50%;background:rgba(242,182,50,.7);color:#10204d;border:2px solid #f6d27a;font:600 18px "Cormorant Garamond",serif;display:none;touch-action:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 60% 35%,#1d3f8a,#081335 70%);z-index:5;text-align:center;padding:20px}
#load h2{font-size:44px;margin:0;color:var(--gold);font-weight:600}
#load p{font-size:18px;margin:10px 0 0}
body.touch #joy,body.touch #jump{display:block}
body.touch .label .keys{display:none}
@media(max-width:600px){.label{top:62px;padding:8px 10px}.label .touchhelp{display:none}.label h1{font-size:21px}.label p{font-size:13px}#stats{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label"><h1>StarryNightRide</h1>
<p class="keys">WASD ride · Shift gallop · Space jump · drag to look · wheel to zoom · F auto-ride · T tour</p>
<p class="touchhelp">Every stroke is paint. The rider follows the road and jumps by himself until you take the reins.</p></div>
<div class="btns"><button id="bAuto" aria-pressed="true">Auto-ride</button><button id="bTour" aria-pressed="false">Camera tour</button></div>
<div id="stats"></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">Jump</button>
<div id="load"><h2>StarryNightRide</h2><p id="loadmsg">Grinding pigments…</p></div>

<script>
{
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0)||params.has('mobile');
if(isTouch)document.body.classList.add('touch');
let Q=+(params.get('q')||(isTouch?0.22:1.0));
const status=t=>{$('loadmsg').textContent=t;};
const tick=()=>new Promise(r=>setTimeout(r,0));
const TAU=Math.PI*2;

/* ---------- Rapier (optional) ---------- */
const RAPIER_URL='https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';
async function loadRapier(){
  if(params.has('norapier'))return null;
  try{
    const m=await Promise.race([import(RAPIER_URL),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),15000))]);
    const R=m.default||m;await R.init();return R;
  }catch(e){console.warn('Rapier unavailable, using built-in physics:',e);return null;}
}
const rapierPromise=loadRapier();

/* ---------- math ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(20261123);
const R=()=>rnd(),RR=(a,b)=>a+(b-a)*rnd();
function hash2(x,z){let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z,o=4){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,z*f);n+=a;f*=2.03;a*=.5;}return s/n;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,v)=>{const t=clamp((v-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul3=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
const M4={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  T(x,y,z){const m=M4.id();m[12]=x;m[13]=y;m[14]=z;return m;},
  RX(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},
  RY(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;},
  RZ(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;},
  persp(f,asp,n,fa){const t=1/Math.tan(f/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m;},
  look(e,t,u){const z=norm3(sub3(e,t)),x=norm3(cross3(u,z)),y=cross3(z,x);const m=M4.id();
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-dot3(x,e);m[13]=-dot3(y,e);m[14]=-dot3(z,e);return m;},
  ap(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]];}
};
const chain=(...ms)=>ms.reduce((a,b)=>M4.mul(a,b));

/* ---------- world layout ---------- */
const riverX=z=>120+25*Math.sin(z/60);
const CLIFF_Z=-228,LOW_W=-1.6,HIGH_W=17.2;
const waterLevel=z=>z<CLIFF_Z?HIGH_W:LOW_W;
const cliffEdge=x=>CLIFF_Z+16*Math.sin((x-135.3)/46)+7*Math.sin((x-135.3)/15)-4*Math.sin((x-135.3)/90);
const riverW=z=>z<CLIFF_Z?6:9;
const FIELD={x:-30,z:20,r:40};
const VILLAGE={x:222,z:32};
const WATERFALL={x:riverX(CLIFF_Z),z:CLIFF_Z};
const WINDMILL={x:-122,z:-44};
const COTTAGE={x:-100,z:-46};
const WHEAT=[{x:-150,z:110,rx:42,rz:26,a:.4},{x:55,z:150,rx:50,rz:28,a:-.2},{x:190,z:150,rx:38,rz:30,a:.7},{x:-40,z:-110,rx:40,rz:22,a:.1},{x:250,z:-60,rx:34,rz:24,a:-.5}];
function inWheat(x,z){for(const w of WHEAT){const c=Math.cos(w.a),s=Math.sin(w.a),dx=x-w.x,dz=z-w.z,u=(dx*c+dz*s)/w.rx,v=(-dx*s+dz*c)/w.rz;if(u*u+v*v<1)return true;}return false;}

function terrainA(x,z){
  const r=Math.hypot(x,z);
  let h=4.2*fbm(x/95+3,z/95+7)-1.4+(fbm(x/33,z/33)-.5)*1.1;
  h+=smooth(200,650,r)*32*fbm(x/170+11,z/170-4,3);
  h+=7*Math.exp(-((x-WINDMILL.x)**2+(z-WINDMILL.z)**2)/1100);
  const df=Math.hypot(x-FIELD.x,z-FIELD.z);h=lerp(h,.9+.25*h,smooth(75,42,df));
  const dv=Math.hypot(x-VILLAGE.x,z-VILLAGE.z);h=lerp(h,1.6+.3*h,smooth(95,50,dv));
  const ce=cliffEdge(x);const p=smooth(ce+11,ce,z)*smooth(-40,25,x+12*Math.sin(z/40));
  h=lerp(h,HIGH_W+2.6+fbm(x/40,z/40)*3.5+smooth(CLIFF_Z-20,CLIFF_Z-160,z)*fbm(x/70,z/70,3)*14,p);
  h=Math.max(h,-0.9);
  const dx=Math.abs(x-riverX(z)),wl=waterLevel(z),W=riverW(z),bed=wl-1.8;
  const t=smooth(W*.45,W*1.5,dx);
  h=bed+(Math.max(h,wl+.7)-bed)*t;
  return h;
}

/* ---------- heightmap grid (shared CPU/GPU) ---------- */
const HN=1024,HE=700,HC=2*HE/(HN-1);
const hgt=new Float32Array(HN*HN),roadM=new Float32Array(HN*HN),typM=new Uint8Array(HN*HN),watM=new Float32Array(HN*HN);
function H(x,z){
  if(x>-HE&&x<HE&&z>-HE&&z<HE){const gx=(x+HE)/HC,gz=(z+HE)/HC;let i=Math.floor(gx),j=Math.floor(gz);if(i>HN-2)i=HN-2;if(j>HN-2)j=HN-2;const fx=gx-i,fz=gz-j,k=j*HN+i;
    return(hgt[k]*(1-fx)+hgt[k+1]*fx)*(1-fz)+(hgt[k+HN]*(1-fx)+hgt[k+HN+1]*fx)*fz;}
  return terrainA(x,z);
}
function gridAt(arr,x,z){const i=clamp(Math.round((x+HE)/HC),0,HN-1),j=clamp(Math.round((z+HE)/HC),0,HN-1);return arr[j*HN+i];}
function normalAt(x,z){const e=1.2;return norm3([H(x-e,z)-H(x+e,z),2*e,H(x,z-e)-H(x,z+e)]);}

/* ---------- route ---------- */
const WP=[[-70,20],[-58.3,48.3],[-30,60],[-1.7,48.3],[10,22.5],[60,22.5],[95,22.5],[150,23],[190,30],[215,60],[245,50],[250,20],[225,0],[195,14],[150,19],[115,19],[60,18.5],[12,18.5],[-1.7,-8.3],[-30,-20],[-58,-8],[-85,-30],[-108,-22],[-95,5]];
const route=[];let routeLen=0;
(function(){
  const n=WP.length,raw=[];
  for(let i=0;i<n;i++){const p0=WP[(i-1+n)%n],p1=WP[i],p2=WP[(i+1)%n],p3=WP[(i+2)%n];
    for(let k=0;k<60;k++){const t=k/60,t2=t*t,t3=t2*t;const f=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);raw.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}}
  raw.push(raw[0]);
  const cum=[0];for(let i=1;i<raw.length;i++)cum.push(cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));
  routeLen=cum[cum.length-1];let j=0;
  for(let s=0;s<routeLen;s+=.5){while(cum[j+1]<s)j++;const t=(s-cum[j])/(cum[j+1]-cum[j]);route.push([lerp(raw[j][0],raw[j+1][0],t),lerp(raw[j][1],raw[j+1][1],t)]);}
})();
const RS=route.length;
function routeAt(s){s=((s%routeLen)+routeLen)%routeLen;const f=s/.5,i=Math.floor(f)%RS,i2=(i+1)%RS,t=f-Math.floor(f);const a=route[i],b=route[i2];
  const tx=b[0]-a[0],tz=b[1]-a[1],l=Math.hypot(tx,tz)||1;return{x:lerp(a[0],b[0],t),z:lerp(a[1],b[1],t),tx:tx/l,tz:tz/l};}
function minRouteDist(x,z,step=4){let m=1e9,mi=0;for(let i=0;i<RS;i+=step){const d=(route[i][0]-x)**2+(route[i][1]-z)**2;if(d<m){m=d;mi=i;}}return{d:Math.sqrt(m),i:mi};}
function nearestS(x,z,s0,win){let best=1e9,bs=s0;const n0=Math.round(s0/.5);
  for(let k=-win;k<=win*2;k++){const i=((n0+k)%RS+RS)%RS;const d=(route[i][0]-x)**2+(route[i][1]-z)**2;if(d<best){best=d;bs=i*.5;}}return{s:bs,d:Math.sqrt(best)};}

/* bridge */
const BR={zc:20.75,hw:3.6,x0:riverX(20.75)-15.5,x1:riverX(20.75)+15.5,yL:0,yR:0,arch:4.2};
function deckY(x){const t=clamp((x-BR.x0)/(BR.x1-BR.x0),0,1);return lerp(BR.yL,BR.yR,t)+2.6*Math.sin(Math.PI*t);}
function onBridge(x,z){return x>BR.x0&&x<BR.x1&&Math.abs(z-BR.zc)<BR.hw+.3;}
function groundAt(x,z){const h=H(x,z);return onBridge(x,z)?Math.max(h,deckY(x)):h;}

/* ---------- stroke buffer ---------- */
const STRIDE=40;
class StrokeBuf{
  constructor(cap){this.alloc(cap);this.n=0;}
  alloc(cap){const nb=new ArrayBuffer(cap*STRIDE);if(this.buf)new Uint8Array(nb).set(new Uint8Array(this.buf,0,this.n*STRIDE));
    const oc=this.chunk;this.buf=nb;this.cap=cap;this.f=new Float32Array(nb);this.i8=new Int8Array(nb);this.u8=new Uint8Array(nb);this.chunk=new Uint16Array(cap);if(oc)this.chunk.set(oc.subarray(0,this.n));}
  add(x,y,z,tx,ty,tz,nx,ny,nz,len,wid,c1,c2,kind,group,bb,sway,chunkOverride){
    if(this.n>=this.cap)this.alloc(Math.ceil(this.cap*1.6));
    const o=this.n*STRIDE,fo=o>>2,f=this.f,u=this.u8,i8=this.i8;
    f[fo]=x;f[fo+1]=y;f[fo+2]=z;
    let l=Math.hypot(tx,ty,tz)||1;i8[o+12]=Math.round(tx/l*127);i8[o+13]=Math.round(ty/l*127);i8[o+14]=Math.round(tz/l*127);u[o+15]=kind;
    l=Math.hypot(nx,ny,nz)||1;i8[o+16]=Math.round(nx/l*127);i8[o+17]=Math.round(ny/l*127);i8[o+18]=Math.round(nz/l*127);u[o+19]=group;
    f[fo+5]=len;f[fo+6]=wid;
    const j=.045;
    u[o+28]=clamp(c1[0]*(1+(R()-.5)*j)*255,0,255);u[o+29]=clamp(c1[1]*(1+(R()-.5)*j)*255,0,255);u[o+30]=clamp(c1[2]*(1+(R()-.5)*j)*255,0,255);u[o+31]=bb*255;
    u[o+32]=clamp(c2[0]*255,0,255);u[o+33]=clamp(c2[1]*255,0,255);u[o+34]=clamp(c2[2]*255,0,255);u[o+35]=clamp(sway*255,0,255);
    u[o+36]=R()*256;u[o+37]=R()*256;u[o+38]=R()*256;u[o+39]=0;
    let ch;
    if(chunkOverride!==undefined)ch=chunkOverride;
    else if(group>0)ch=0;else if(kind===1)ch=1;
    else{const r=Math.hypot(x,z);if(r>840){ch=402+Math.floor(((Math.atan2(z,x)/TAU)+1)%1*24);}else{ch=2+clamp(Math.floor((z+800)/80),0,19)*20+clamp(Math.floor((x+800)/80),0,19);}}
    this.chunk[this.n]=ch;this.n++;
  }
}
const NCH=426;
const SB=new StrokeBuf(Math.ceil(1.3e6*Q)+60000);
const K={SURF:0,SKY:1,WATER:2,FALL:3,EMIT:4,PLANT:5,FOAM:6};
function addS(p,t,n,len,wid,c1,c2,kind=0,group=0,bb=0,sway=0){SB.add(p[0],p[1],p[2],t[0],t[1],t[2],n[0],n[1],n[2],len,wid,c1,c2,kind,group,bb,sway);}

/* ---------- underpaint mesh (solid ground under the paint) ---------- */
const UPm=[];// x,y,z,nx,ny,nz,r,g,b
function uTri(a,b,c,col,center){let n=norm3(cross3(sub3(b,a),sub3(c,a)));if(center){const m=[(a[0]+b[0]+c[0])/3-center[0],(a[1]+b[1]+c[1])/3-center[1],(a[2]+b[2]+c[2])/3-center[2]];if(dot3(n,m)<0)n=mul3(n,-1);}
  for(const p of[a,b,c])UPm.push(p[0],p[1],p[2],n[0],n[1],n[2],col[0],col[1],col[2]);}
function uQuad(a,b,c,d,col,center){uTri(a,b,c,col,center);uTri(a,c,d,col,center);}

/* ---------- paints: [highlight, shadow] (moonlit = cool and desaturated) ---------- */
const PAINT={
  grass:[[.30,.45,.42],[.07,.15,.21]],grass2:[[.38,.50,.37],[.10,.18,.21]],road:[[.57,.56,.50],[.19,.22,.30]],
  soil:[[.30,.29,.27],[.09,.11,.17]],wheat:[[.66,.60,.41],[.21,.23,.30]],rock:[[.47,.50,.54],[.13,.16,.24]],dirt:[[.47,.46,.43],[.15,.17,.24]],
  wall:[[.60,.62,.65],[.17,.20,.30]],wall2:[[.62,.58,.52],[.18,.19,.28]],roof:[[.38,.37,.42],[.09,.10,.18]],roof2:[[.50,.37,.34],[.13,.10,.17]],
  wood:[[.40,.32,.27],[.09,.08,.12]],stone:[[.53,.53,.55],[.15,.17,.25]],cypress:[[.20,.33,.27],[.03,.07,.10]],tree:[[.25,.38,.34],[.05,.10,.14]],
  stem:[[.30,.42,.30],[.07,.13,.15]],petal:[[.74,.64,.30],[.24,.26,.29]],disk:[[.36,.27,.16],[.09,.08,.11]],
  horse:[[.48,.38,.33],[.11,.09,.13]],mane:[[.20,.16,.16],[.04,.04,.07]],leather:[[.36,.25,.20],[.07,.06,.09]],blanket:[[.52,.32,.30],[.12,.08,.13]],
  cloak:[[.27,.42,.74],[.05,.09,.27]],hat:[[.52,.47,.33],[.12,.11,.13]],skin:[[.66,.56,.50],[.20,.17,.20]],boot:[[.18,.15,.14],[.04,.04,.06]],
  metal:[[.30,.30,.32],[.06,.06,.09]],sail:[[.62,.60,.56],[.18,.19,.27]],bark:[[.38,.30,.25],[.09,.08,.11]],snow:[[.86,.90,.95],[.42,.50,.66]],
  m1:[[.22,.36,.42],[.05,.11,.19]],m2:[[.27,.37,.56],[.08,.12,.27]],m3:[[.37,.45,.63],[.12,.16,.33]]
};
const WARM1=[1.0,.80,.36],WARM2=[.98,.58,.18];
const lamps=[];// {x,y,z,I}

/* ---------- surface samplers ---------- */
function ellip(c,r,n,paint,o={}){
  const B=o.basis||[[1,0,0],[0,1,0],[0,0,1]],ta=o.tan,len=o.len||.3,wid=o.wid||.1,g=o.group||0,kind=o.kind||0,bb=o.bb??.6,jit=o.jit??.35;
  for(let i=0;i<n;i++){
    const z=2*R()-1,a=TAU*R(),s=Math.sqrt(1-z*z);const u=[s*Math.cos(a),z,s*Math.sin(a)];
    if(o.minY!==undefined&&u[1]<o.minY)continue;

      addS([Math.cos(th)*r,y,Math.sin(th)*r],tg,nr,sl*(.8+.5*R()),sl*.3,paint[0],paint[1],0,0,.15,0);}

}

/* ground strokes, water, waterfall, wheat, grass gaps */
function interestDist(x,z,ri){return Math.min(ri,Math.hypot(x-WATERFALL.x,z-WATERFALL.z)-25,Math.hypot(x-VILLAGE.x,z-VILLAGE.z)-55,Math.hypot(x-WINDMILL.x,z-WINDMILL.z)-20);}
let routeGrid;
function buildRouteGrid(){const G=160,E=880,cs=2*E/G;routeGrid={G,E,cs,d:new Float32Array(G*G),i:new Int32Array(G*G)};
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){const x=-E+(i+.5)*cs,z=-E+(j+.5)*cs;const r=minRouteDist(x,z,6);routeGrid.d[j*G+i]=r.d;routeGrid.i[j*G+i]=r.i;}}
function ground(){
  const {G,E,cs}=routeGrid;const levels=[.62,1.15,2.2,4.0];

    const cx=-E+(i+.5)*cs,cz=-E+(j+.5)*cs;if(Math.hypot(cx,cz)>885)continue;
    const di=interestDist(cx,cz,routeGrid.d[j*G+i]);const lv=di<45?0:di<130?1:di<300?2:3;const s=levels[lv]/Math.sqrt(Q);
    const ri=routeGrid.i[j*G+i],rt=routeAt(ri*.5);
    for(let gz=0;gz<cs;gz+=s)for(let gx=0;gx<cs;gx+=s){
      const x=cx-cs/2+gx+R()*s,z=cz-cs/2+gz+R()*s;const r=Math.hypot(x,z);if(r>875)continue;
      const inside=Math.abs(x)<HE-2&&Math.abs(z)<HE-2;
      if(inside&&gridAt(watM,x,z)>.5)continue;
      const h=H(x,z),nr=normalAt(x,z),slope=1-nr[1];
      const road=inside?gridAt(roadM,x,z):0,type=inside?gridAt(typM,x,z):0;
      let paint,tg;
      if(slope>.42){paint=PAINT.rock;const dn=norm3([nr[0],0,nr[2]]);tg=norm3([dn[0]+R()-.5,-.8,dn[2]+R()-.5]);}
      else if(road>.5){paint=PAINT.road;tg=[rt.tx+(R()-.5)*.5,0,rt.tz+(R()-.5)*.5];}
      else if(type===1){paint=PAINT.soil;const dx=x-FIELD.x,dz=z-FIELD.z;tg=[-dz,0,dx];}
      else if(type===2){paint=PAINT.wheat;const a=.6+Math.sin(x*.05)*.3;tg=[Math.cos(a),0,Math.sin(a)];}
      else if(type===3){paint=PAINT.dirt;tg=[R()-.5,0,R()-.5];}
      else{paint=fbm(x/60+5,z/60)>.5?PAINT.grass2:PAINT.grass;const a=fbm(x/45,z/45,3)*14;tg=[Math.cos(a),0,Math.sin(a)];}
      const len=s*2.3*(.8+.4*R()),wid=s*.75*(.8+.4*R());
      addS([x,h+.03,z],[tg[0],-(nr[0]*tg[0]+nr[2]*tg[2])/nr[1],tg[2]],nr,len,wid,paint[0],paint[1],0,0,0,0);
      if(lv===0){const x2=x+RR(-.5,.5)*s,z2=z+RR(-.5,.5)*s;addS([x2,H(x2,z2)+.05,z2],[tg[0]+RR(-.3,.3),-(nr[0]*tg[0]+nr[2]*tg[2])/nr[1],tg[2]+RR(-.3,.3)],nr,len*.85,wid*.9,paint[0],paint[1],0,0,0,0);}
      if(type===2&&lv<=1){for(let k=0;k<3;k++){const wx=x+RR(-.5,.5)*s,wz=z+RR(-.5,.5)*s,wh=H(wx,wz);addS([wx,wh+.42,wz],[RR(-.15,.15),1,RR(-.15,.15)],[0,.3,1],.85,.07,PAINT.wheat[0],PAINT.wheat[1],K.PLANT,0,1,.8);}}
    }
  }
}

    const tp=horse.grounded?-Math.atan2(hf-hb,1.8):-clamp(horse.vy*.05,-.3,.3);horse.pitch+=(tp-horse.pitch)*Math.min(1,dt*6);
  }
  function poseHorse(t){
    const sp=horse.speed,ph=horse.phase*TAU;const air=!horse.grounded;
    const bob=air?0:(sp<.3?Math.sin(t*1.5)*.01:Math.abs(Math.sin(ph))*(horse.gallop?.12:.06));
    const root=chain(M4.T(horse.x,horse.y+bob,horse.z),M4.RY(horse.yaw),M4.RX(horse.pitch+(horse.gallop&&!air?Math.sin(ph)*.05:0)));
    groups.set(root,16);
    const nod=(sp<.3?Math.sin(t*.8)*.05+.1:Math.sin(ph*(horse.gallop?1:2))*.08)+(air?-.25:0)+(horse.gallop?.25:0);
    groups.set(chain(root,M4.T(0,1.62,.86),M4.RX(nod)),32);
    const offs=horse.gallop?[0,.1,.55,.66]:sp<3.5?[0,.5,.75,.25]:[0,.5,.5,0];const amp=sp<.3?0:horse.gallop?.75:sp<3.5?.35:.5;
    for(let L=0;L<4;L++){const front=L<2;const p=ph+offs[L]*TAU;let a=-amp*Math.sin(p),b;
      if(front)b=amp*1.4*Math.max(0,Math.sin(p+1.3));else b=-amp*1.0*Math.max(0,Math.sin(p+1.3));
      if(air){const k=clamp(horse.jumpT*3,0,1)*clamp(horse.vy*.2+1.2,0,1);a=front?lerp(a,-.75,k):lerp(a,.6,k);b=front?lerp(b,1.6,k):lerp(b,-.9,k);}
      const upper=chain(root,M4.T(...HIPS[L]),M4.RX(a));groups.set(upper,(3+L)*16);groups.set(chain(upper,M4.T(0,-.58,0),M4.RX(b)),(7+L)*16);}
    groups.set(chain(root,M4.T(0,1.52,-1.02),M4.RX(-.35-sp*.04+Math.sin(t*2.1)*.08),M4.RZ(Math.sin(t*1.7)*.12)),176);
    const rider=chain(root,M4.T(0,1.86-bob*.6,-.04),M4.RX((horse.gallop?.18:.04)+(air?.15:0)));groups.set(rider,192);
    const sw=Math.sin(t*2.3+horse.phase)*(.08+sp*.015);const lan=chain(rider,M4.T(-.5,.5,.36),M4.RX(-horse.pitch*.5-sp*.012+sw*.5),M4.RZ(sw));groups.set(lan,208);
    lanternPos=M4.ap(lan,0,-.27,0);
    if(WINDMILL.hub){const h=WINDMILL.hub;groups.set(chain(M4.T(h[0],h[1],h[2]),M4.RY(WINDMILL.yaw),M4.RX(-.12),M4.RZ(-t*.55)),224);}
  }

  /* ---------- render loop ---------- */
  let pixScale=1,dpr=Math.min(window.devicePixelRatio||1,isTouch?3:2);let W=0,Hh=0,cssW=0,cssH=0;
  function resize(){cssW=innerWidth;cssH=innerHeight;W=Math.max(1,Math.round(cssW*dpr*pixScale));Hh=Math.max(1,Math.round(cssH*dpr*pixScale));if(canvas.width!==W||canvas.height!==Hh){canvas.width=W;canvas.height=Hh;}}
  addEventListener('resize',resize);resize();
  const lampU=new Float32Array(64),vortU=new Float32Array(24),starU=new Float32Array(64);
  VORT.forEach((v,i)=>vortU.set(v,i*4));STARS.forEach((s,i)=>starU.set(s,i*4));
  const fovY=55*Math.PI/180;
  let view,proj,vp,eye=[0,0,0],nl=0;
  function frustumPlanes(m){const p=[];const r=(i)=>[m[i],m[4+i],m[8+i],m[12+i]];const r0=r(0),r1=r(1),r2=r(2),r3=r(3);
    for(const [a,s] of[[r0,1],[r0,-1],[r1,1],[r1,-1],[r2,1]]){p.push([r3[0]+s*a[0],r3[1]+s*a[1],r3[2]+s*a[2],r3[3]+s*a[3]]);}return p;}
  function boxVisible(pl,mn,mx){for(const p of pl){const x=p[0]>0?mx[0]:mn[0],y=p[1]>0?mx[1]:mn[1],z=p[2]>0?mx[2]:mn[2];if(p[0]*x+p[1]*y+p[2]*z+p[3]<0)return false;}return true;}
  function setCommon(P,t){const U=P.U;gl.useProgram(P.p);
    U.uView&&gl.uniformMatrix4fv(U.uView,false,view);U.uProj&&gl.uniformMatrix4fv(U.uProj,false,proj);U.uVP&&gl.uniformMatrix4fv(U.uVP,false,vp);
    U.uCam&&gl.uniform3fv(U.uCam,eye);U.uTime&&gl.uniform1f(U.uTime,t);U.uRes&&gl.uniform2f(U.uRes,W/2,Hh/2);
    const focal=Hh/2/Math.tan(fovY/2);U.uFocal&&gl.uniform1f(U.uFocal,focal);
    const pr=W/cssW;U.uPx&&gl.uniform2f(U.uPx,(isTouch?11:7.5)*pr,240*pr);U.uKMax&&gl.uniform1f(U.uKMax,5);
    U.uMoon&&gl.uniform3fv(U.uMoon,MOON);U.uLamps&&gl.uniform4fv(U.uLamps,lampU);U.uNL&&gl.uniform1i(U.uNL,nl);
    U.uVort&&gl.uniform4fv(U.uVort,vortU);U.uStars&&gl.uniform4fv(U.uStars,starU);
    U.uBridge&&gl.uniform4f(U.uBridge,BR.x0,BR.x1,BR.zc,BR.hw+.4);U.uBridge2&&gl.uniform4f(U.uBridge2,deckY((BR.x0+BR.x1)/2)+1,LOW_W,BR.arch,BR.span);
    U.uGroups&&gl.uniformMatrix4fv(U.uGroups,false,groups);}
  let stats={fps:0,drawn:0,frames:0};
  function render(t){
    resize();
    // camera
    const target=[horse.x,horse.y+2.3,horse.z];
    if(tourMode){tourT+=1/60;const tp=tourPose(tourT);eye=tp.eye;view=M4.look(eye,tp.look,[0,1,0]);}
    else{const cp=Math.cos(cam.pitch);const f=[Math.sin(cam.yaw)*cp,-Math.sin(cam.pitch),Math.cos(cam.yaw)*cp];
      eye=[target[0]-f[0]*cam.dist,target[1]-f[1]*cam.dist,target[2]-f[2]*cam.dist];const g=groundAt(eye[0],eye[2])+.7;if(eye[1]<g)eye[1]=g;
      view=M4.look(eye,target,[0,1,0]);}
    proj=M4.persp(fovY,W/Hh,.25,9000);vp=M4.mul(proj,view);
    // lamps: lantern + nearest
    lampU.set([lanternPos[0],lanternPos[1],lanternPos[2],1.6],0);
    const ls=lamps.map(l=>[(l.x-eye[0])**2+(l.z-eye[2])**2,l]).sort((a,b)=>a[0]-b[0]);nl=1;
    for(let i=0;i<15&&i<ls.length;i++){const l=ls[i][1];lampU.set([l.x,l.y,l.z,l.I],nl*4);nl++;}
    gl.viewport(0,0,W,Hh);gl.clearColor(.06,.12,.30,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    // 1 sky (painter's order, no depth)
    gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setCommon(progSky,t);gl.bindVertexArray(vaoS);
    const sky=chunks.find(c=>c.id===1);setAttr(sky.start);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,sky.count);
    // 2 underpaint
    gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1.5,3);
    setCommon(progU,t);gl.bindVertexArray(meshT.vao);gl.drawElements(gl.TRIANGLES,meshT.count,gl.UNSIGNED_INT,0);
    gl.bindVertexArray(meshU.vao);gl.drawArrays(gl.TRIANGLES,0,meshU.count);gl.disable(gl.POLYGON_OFFSET_FILL);
    // 3 strokes
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);setCommon(progS,t);gl.bindVertexArray(vaoS);
    const pl=frustumPlanes(vp);let drawn=0;
    for(const c of chunks){if(c.id===1)continue;if(c.id!==0&&!boxVisible(pl,c.mn,c.mx))continue;setAttr(c.start);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,c.count);drawn+=c.count;}
    // 4 real-time grass around the camera
    const gh=eye[1]-groundAt(eye[0],eye[2]);
    if(gh<45){setCommon(progG,t);const U=progG.U;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,hmTex);gl.uniform1i(U.uHM,0);gl.uniform4f(U.uHMI,HE,HN,HC,0);
      const fw=[view[2],view[10]];const fl=Math.hypot(fw[0],fw[1])||1;const GN=isTouch?150:260,GS=.2;
      gl.uniform3f(U.uGC,eye[0]-fw[0]/fl*GN*GS*.3,0,eye[2]-fw[1]/fl*GN*GS*.3);gl.uniform1f(U.uGS,GS);gl.uniform1i(U.uGN,GN);
      gl.bindVertexArray(vaoG);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,GN*GN);drawn+=GN*GN;}
    gl.bindVertexArray(null);stats.drawn=drawn;
  }
  let last=performance.now(),acc=0,fpsAcc=0,fpsN=0,lastAdj=0,simT=0;
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;simT+=dt;
    simulate(dt,simT);poseHorse(simT);
    if(!tourMode&&performance.now()-cam.lastDrag>2500&&horse.speed>1){let dy=((horse.yaw-cam.yaw+Math.PI*3)%TAU)-Math.PI;cam.yaw+=dy*Math.min(1,dt*1.2);}
    render(simT);stats.frames++;
    fpsAcc+=Math.min(1,(now-(frame.prev||now))/1000);frame.prev=now;fpsN++;
    if(fpsAcc>1){const fps=fpsN/fpsAcc;stats.fps=fps;fpsAcc=0;fpsN=0;
      if(now-lastAdj>2000&&!params.has('noscale')){if(fps<36&&pixScale>.42){pixScale=Math.max(.42,pixScale*.84);lastAdj=now;}else if(fps>56&&pixScale<1){pixScale=Math.min(1,pixScale*1.1);lastAdj=now;}}
      $('stats').textContent=`${fps.toFixed(0)} fps · ${(totalStrokes/1e6).toFixed(2)}M strokes · ${W}×${Hh} (${(pixScale*100).toFixed(0)}%) · physics: ${phys.name}`;}
    requestAnimationFrame(frame);
  }
  window.__srn={horse,cam,phys:()=>phys.name,totalStrokes,chunks:chunks.length,nFlowers,routeLen,obstacles,stats,
    setTour,setAuto,keys,
    step(n,dt=1/60){for(let i=0;i<n;i++){simT+=dt;simulate(dt,simT);}poseHorse(simT);},
    render(){poseHorse(simT);render(simT);gl.finish();},
    tourAt(t){tourMode=true;tourT=t;},
    heightCheck(){const out=[];for(const [x,z] of[[0,0],[-100,50],[150,-100],[220,30],[-300,200],[400,-50]])out.push([x,z,+H(x,z).toFixed(3),phys.rayDown(x,z)]);return out;},
    rapierAvailable:!!RAP};
  $('load').style.display='none';
  requestAnimationFrame(frame);
  }catch(err){console.error(err);status('Something went wrong: '+err.message);}
})();
}
</script>
